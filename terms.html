<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms and Conditions - SK News</title>
    <meta name="description" content="Read the terms and conditions for using SK News chat and text services.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
    <link rel="canonical" href="https://SKNews.pages.dev/terms.html" />
</head>
<body class="bg-gray-900 text-gray-200">

    <header class="fixed top-0 left-0 right-0 z-40 bg-gray-900/80 backdrop-blur-sm border-b border-gray-800 transition-all duration-300">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="text-2xl font-bold text-teal-400 hover:text-teal-300 transition-colors">SK News</a>
                <nav class="hidden md:flex space-x-8" id="main-nav">
                    <a href="index.html" class="text-gray-300 hover:text-teal-400 transition-colors">Home</a>
                    <a href="news.html" class="text-gray-300 hover:text-teal-400 transition-colors">News</a>
                    <a href="chats.html" class="text-gray-300 hover:text-teal-400 transition-colors">Chats</a>
                    <a href="sites.html" class="text-gray-300 hover:text-teal-400 transition-colors">Sites</a>
                    <a href="join.html" class="text-gray-300 hover:text-teal-400 transition-colors">Join</a>
                    <a href="about.html" class="text-gray-300 hover:text-teal-400 transition-colors">About</a>
                    <a href="advertise.html" class="text-gray-300 hover:text-teal-400 transition-colors">Advertise</a>
                    <a href="contact.html" class="text-gray-300 hover:text-teal-400 transition-colors">Contact</a>
                </nav>
                <button class="md:hidden hamburger flex flex-col justify-center items-center h-8 w-8 space-y-1.5" id="hamburger-menu" aria-label="Open Menu">
                    <span class="block h-0.5 w-6 bg-gray-200 rounded-full"></span>
                    <span class="block h-0.5 w-6 bg-gray-200 rounded-full"></span>
                    <span class="block h-0.5 w-6 bg-gray-200 rounded-full"></span>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-gray-900/95 backdrop-blur-sm">
            <nav class="flex flex-col items-center space-y-4 py-6">
                <a href="index.html" class="text-gray-300 hover:text-teal-400 transition-colors">Home</a>
                <a href="news.html" class="text-gray-300 hover:text-teal-400 transition-colors">News</a>
                <a href="chats.html" class="text-gray-300 hover:text-teal-400 transition-colors">Chats</a>
                <a href="sites.html" class="text-gray-300 hover:text-teal-400 transition-colors">Sites</a>
                <a href="join.html" class="text-gray-300 hover:text-teal-400 transition-colors">Join</a>
                <a href="about.html" class="text-gray-300 hover:text-teal-400 transition-colors">About</a>
                <a href="advertise.html" class="text-gray-300 hover:text-teal-400 transition-colors">Advertise</a>
                <a href="contact.html" class="text-gray-300 hover:text-teal-400 transition-colors">Contact</a>
            </nav>
        </div>
    </header>

    <main class="pt-28 sm:pt-32">
        <section class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-4xl font-bold text-center bg-gradient-to-r from-teal-400 to-cyan-500 bg-clip-text text-transparent">Terms and Conditions</h1>
                <p class="mt-4 text-lg text-gray-400 text-center">Please read these terms carefully before using our chat and text services.</p>

                <div id="terms-content" class="mt-12 prose prose-invert max-w-none prose-p:text-gray-300 prose-headings:text-teal-400">
                    <!-- Content will be loaded here from Supabase -->
                    <p class="text-center">Loading terms...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="mt-24 border-t border-gray-800 bg-gray-900">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8"><div class="flex flex-col sm:flex-row items-center justify-between py-6 text-sm text-gray-500"><p>© 2025 SK News. All Rights Reserved.</p><a href="terms.html" class="mt-2 sm:mt-0 hover:text-teal-400 transition-colors">Terms & Conditions</a></div></div>
    </footer>

    <script type="module">
        import { supabase } from './supabase-client.js';

        async function loadTerms() {
            const contentContainer = document.getElementById('terms-content');
            const { data, error } = await supabase
                .from('news_admin')
                .select('content')
                .eq('page', 'terms')
                .eq('element_id', 'terms-content')
                .single();

            if (error || !data) {
                console.error('Error fetching terms:', error);
                contentContainer.innerHTML = '<p>Could not load the terms and conditions at this time. Please try again later.</p>';
            } else {
                // Basic markdown to HTML conversion
                let htmlContent = data.content;
                // Simple conversion for headings, lists, etc.
                htmlContent = htmlContent.replace(/^### (.*$)/gim, '<h3 class="text-xl font-semibold text-teal-400 mt-6 mb-2">$1</h3>');
                htmlContent = htmlContent.replace(/\\n/g, '<br>');
                contentContainer.innerHTML = htmlContent;
            }
        }

        document.addEventListener('DOMContentLoaded', loadTerms);
    </script>
    <script>
        const hamburgerBtn = document.getElementById('hamburger-menu');
        const mobileMenu = document.getElementById('mobile-menu');
        hamburgerBtn.addEventListener('click', () => {
            hamburgerBtn.classList.toggle('is-active');
            mobileMenu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
