<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - SK News</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 12px;
        }

        body.dark-mode {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; min-height: 100vh; transition: background-color 0.3s, color 0.3s; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }

        /* --- AUTH PAGE --- */
        #auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-card { width: 100%; max-width: 400px; background: var(--bg-card); padding: 2.5rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .input-group { margin-bottom: 1.25rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
        .input-field { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none; }
        
        /* --- TOP NAVIGATION --- */
        .navbar { height: 70px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 2rem; position: sticky; top: 0; z-index: 100; }
        .navbar-brand { font-size: 1.25rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .nav-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }

        /* --- MAIN CONTENT --- */
        .main-content { max-width: 1700px; margin: 0 auto; padding: 2rem; width: 100%; }
        .content-header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-end; }
        
        /* --- DASHBOARD COMPONENTS --- */
        .card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); padding: 1.5rem; margin-bottom: 1.5rem; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .metric-card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .metric-value { font-size: 1.8rem; font-weight: 700; margin: 10px 0; color: var(--text-main); }
        .metric-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
        .metric-icon { position: absolute; right: 20px; top: 20px; font-size: 2.5rem; opacity: 0.05; transform: rotate(-10deg); }

        /* --- FILTERS --- */
        .filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); }
        .filter-input { padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none; font-size: 0.85rem; width: 100%; }

        /* --- BUTTONS & INPUTS --- */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-secondary { background: var(--bg-card); color: var(--text-main); border-color: var(--border); }
        .btn-danger-soft { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: none; padding: 0.4rem 0.6rem; font-size: 0.75rem; }
        .btn-danger-soft:hover { background: var(--danger); color: white; }
        .select-input { padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border); background-color: var(--bg-card); color: var(--text-main); outline: none; }

        /* --- TABLE --- */
        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: var(--bg-card); font-size: 0.8rem; }
        th { text-align: left; padding: 1rem; background: rgba(0,0,0,0.02); color: var(--text-muted); font-weight: 600; font-size: 0.65rem; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        body.dark-mode th { background: rgba(255,255,255,0.02); }
        td { padding: 1rem; border-bottom: 1px solid var(--border); color: var(--text-main); vertical-align: middle; }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; }
        .badge-page { background: rgba(37, 99, 235, 0.1); color: var(--primary); }
        .badge-click { background: rgba(16, 185, 129, 0.1); color: var(--success); }

        .truncate-text { display: block; font-size: 0.7rem; color: var(--text-muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
        .truncate-text:hover { text-decoration: underline; color: var(--primary); }
        
        .event-detail-box { font-family: monospace; font-size: 0.75rem; background: rgba(0,0,0,0.03); padding: 4px 8px; border-radius: 4px; display: inline-block; word-break: break-all; max-width: 250px; }
        body.dark-mode .event-detail-box { background: rgba(255,255,255,0.05); }

        @media (max-width: 1024px) {
            .navbar { padding: 0 1rem; }
            .content-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
        }
    </style>
</head>
<body class="dark-mode">

    <div id="auth-container">
        <div class="auth-card">
            <div style="text-align:center; margin-bottom: 2rem;">
                <i class="fa-solid fa-newspaper" style="color:var(--primary); font-size: 2.5rem; margin-bottom: 1rem;"></i>
                <h2 style="margin:0">SK News</h2>
                <p style="color:var(--text-muted); font-size: 0.9rem;">Analytics Portal Login</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" class="input-field" placeholder="admin@sknews.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Sign In</button>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="hidden">
        <header class="navbar">
            <div class="navbar-brand">
                <i class="fa-solid fa-chart-line" style="color:var(--primary)"></i>
                SK NEWS <span style="font-weight: 300; opacity: 0.5;">ANALYTICS</span>
            </div>
            <div class="nav-actions">
                <button class="btn btn-secondary" id="theme-btn" onclick="toggleTheme()">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="btn btn-secondary" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span style="margin-left:5px">Logout</span>
                </button>
            </div>
        </header>

        <main class="main-content">
            <div class="content-header">
                <div>
                    <h1 style="margin:0; font-size: 1.5rem;">Live Activity</h1>
                    <p style="color:var(--text-muted); margin: 0.2rem 0 0 0; font-size: 0.9rem;">Monitoring interactions across the SK News network.</p>
                </div>
                <div class="flex items-center gap-2">
                    <select id="limit-select" class="select-input" onchange="loadData()">
                        <option value="50">Last 50</option>
                        <option value="100">Last 100</option>
                        <option value="500">Last 500</option>
                        <option value="1000" selected>Last 1000</option>
                    </select>
                    <button class="btn btn-secondary" onclick="loadData()"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-title">Filtered Interactions</span>
                    <span class="metric-value" id="metric-total">--</span>
                    <i class="fa-solid fa-database metric-icon"></i>
                </div>
                <div class="metric-card">
                    <span class="metric-title">Unique IPs</span>
                    <span class="metric-value" id="metric-unique">--</span>
                    <i class="fa-solid fa-users metric-icon"></i>
                </div>
                <div class="metric-card">
                    <span class="metric-title">Avg. Load Time</span>
                    <span class="metric-value" id="metric-load">--</span>
                    <i class="fa-solid fa-clock-rotate-left metric-icon"></i>
                </div>
            </div>

            <div class="card" style="height:250px; padding-bottom: 2rem;">
                <canvas id="trafficChart"></canvas>
            </div>

            <!-- FILTERS SECTION -->
            <div class="filter-bar">
                <input type="text" id="filter-ip" class="filter-input" placeholder="Filter by IP Address..." oninput="applyFilters()">
                <select id="filter-event" class="filter-input" onchange="applyFilters()">
                    <option value="">All Events</option>
                    <option value="page_view">Page Views</option>
                    <option value="click">Clicks</option>
                </select>
                <select id="filter-browser" class="filter-input" onchange="applyFilters()">
                    <option value="">All Browsers</option>
                </select>
                <select id="filter-page" class="filter-input" onchange="applyFilters()">
                    <option value="">All Pages</option>
                </select>
            </div>

            <div class="card table-wrapper" style="padding: 0;">
                <table id="log-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Event</th>
                            <th>Page</th>
                            <th>Screen</th>
                            <th>Browser/OS</th>
                            <th>Referrer</th>
                            <th>IP / Session</th>
                            <th>Event Details</th>
                            <th style="text-align:right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="log-tbody">
                        <tr><td colspan="9" style="text-align:center; padding: 3rem;">Fetching interactions...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { supabase } from './supabase-client.js';

        let state = { theme: localStorage.getItem('theme') || 'dark' };
        let myChart = null;
        let allLogs = []; // Stores the raw data from Supabase

        window.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            const { data: { session } } = await supabase.auth.getSession();
            updateUIForAuth(session);
            supabase.auth.onAuthStateChange((_, s) => updateUIForAuth(s));
            document.getElementById('login-form').addEventListener('submit', handleLogin);
        });

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            btn.disabled = true; btn.textContent = "Verifying...";
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { Swal.fire('Error', error.message, 'error'); btn.disabled = false; btn.textContent = "Sign In"; }
        }

        async function handleLogout() { await supabase.auth.signOut(); window.location.reload(); }

        function updateUIForAuth(session) {
            document.getElementById('auth-container').classList.toggle('hidden', !!session);
            document.getElementById('dashboard-view').classList.toggle('hidden', !session);
            if (session) loadData();
        }

        async function loadData() {
            const limit = document.getElementById('limit-select').value;
            try {
                const { data: logs, error } = await supabase
                    .from('news_website_visitors')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(limit);

                if (error) throw error;
                
                allLogs = logs.map(l => ({
                    ...l,
                    parsedMeta: typeof l.meta === 'string' ? JSON.parse(l.meta) : (l.meta || {}),
                    parsedEvent: typeof l.event_data === 'string' ? JSON.parse(l.event_data) : (l.event_data || {})
                }));

                populateFilterOptions();
                applyFilters(); // This calls renderTable and processMetrics
                renderChart(allLogs);
            } catch (err) {
                document.getElementById('log-tbody').innerHTML = `<tr><td colspan="9" style="text-align:center; color:var(--danger)">${err.message}</td></tr>`;
            }
        }

        function populateFilterOptions() {
            const browserSelect = document.getElementById('filter-browser');
            const pageSelect = document.getElementById('filter-page');
            
            // Clear existing except first
            browserSelect.innerHTML = '<option value="">All Browsers</option>';
            pageSelect.innerHTML = '<option value="">All Pages</option>';

            const browsers = [...new Set(allLogs.map(l => l.parsedMeta.browser).filter(Boolean))].sort();
            const pages = [...new Set(allLogs.map(l => l.page_name).filter(Boolean))].sort();

            browsers.forEach(b => browserSelect.innerHTML += `<option value="${b}">${b}</option>`);
            pages.forEach(p => pageSelect.innerHTML += `<option value="${p}">${p}</option>`);
        }

        function applyFilters() {
            const ipVal = document.getElementById('filter-ip').value.toLowerCase();
            const eventVal = document.getElementById('filter-event').value;
            const browserVal = document.getElementById('filter-browser').value;
            const pageVal = document.getElementById('filter-page').value;

            const filtered = allLogs.filter(log => {
                const matchIP = log.ip_address.toLowerCase().includes(ipVal);
                const matchEvent = !eventVal || log.event_type === eventVal;
                const matchBrowser = !browserVal || log.parsedMeta.browser === browserVal;
                const matchPage = !pageVal || log.page_name === pageVal;
                return matchIP && matchEvent && matchBrowser && matchPage;
            });

            processMetrics(filtered);
            renderTable(filtered);
        }

        function processMetrics(logs) {
            animateValue('metric-total', logs.length);
            const uniqueIPs = new Set(logs.map(l => l.ip_address)).size;
            animateValue('metric-unique', uniqueIPs);
            
            const lts = logs.filter(l => l.event_type === 'page_view').map(l => l.parsedEvent?.load_time || 0).filter(t => t > 0);
            const avg = lts.length ? (lts.reduce((a, b) => a + b, 0) / lts.length).toFixed(0) : 0;
            document.getElementById('metric-load').textContent = `${avg}ms`;
        }

        function renderTable(logs) {
            const tbody = document.getElementById('log-tbody');
            if (!logs.length) { tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding: 2rem;">No logs match your filters.</td></tr>'; return; }

            tbody.innerHTML = logs.map(log => {
                const meta = log.parsedMeta;
                const eventData = log.parsedEvent;
                
                const rawTitle = log.page_name || 'Unnamed Page';
                const truncatedTitle = rawTitle.length > 20 ? rawTitle.substring(0, 20) + '...' : rawTitle;
                const time = new Date(log.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const isClick = log.event_type === 'click';
                const referrer = meta.referrer || 'Direct';
                
                let bIcon = '<i class="fa-solid fa-globe"></i>';
                const b = (meta.browser || '').toLowerCase();
                if(b.includes('chrome')) bIcon = '<i class="fa-brands fa-chrome" style="color:#db4437"></i>';
                else if(b.includes('safari')) bIcon = '<i class="fa-brands fa-safari" style="color:#00a4e4"></i>';
                else if(b.includes('firefox')) bIcon = '<i class="fa-brands fa-firefox" style="color:#ff7139"></i>';

                let details = '';
                if (isClick) {
                    details = `<div class="event-detail-box">
                        <span style="opacity:0.6">${eventData.element_type || 'elem'}:</span> "${eventData.element_text || '?'}"
                        ${eventData.target_url ? `<br><span style="font-size:9px; opacity:0.5">To: ${eventData.target_url}</span>` : ''}
                    </div>`;
                } else {
                    details = `<div class="event-detail-box"><i class="fa-solid fa-bolt" style="color:var(--warning); font-size:10px"></i> ${Math.round(eventData.load_time || 0)}ms</div>`;
                }

                return `
                    <tr id="row-${log.id}">
                        <td style="white-space:nowrap; opacity:0.7">${time}</td>
                        <td><span class="badge ${isClick ? 'badge-click' : 'badge-page'}">${log.event_type}</span></td>
                        <td>
                            <div style="font-weight:600" title="${rawTitle}">${truncatedTitle}</div>
                            <a href="${log.page_url}" target="_blank" class="truncate-text" title="${log.page_url}">${log.page_url}</a>
                        </td>
                        <td style="font-family:monospace; opacity:0.8">${meta.screen || '-'}</td>
                        <td>
                            <span style="font-size:0.9rem" title="${meta.browser}">${bIcon}</span>
                            <span style="font-size:0.7rem; margin-left:4px; opacity:0.7">${meta.os || ''}</span>
                        </td>
                        <td><span class="truncate-text" title="${referrer}">${referrer}</span></td>
                        <td>
                            <div style="font-family:monospace">${log.ip_address}</div>
                            <div style="font-size:0.6rem; opacity:0.4">UID: ${log.session_id ? log.session_id.substring(0,6) : '--'}</div>
                        </td>
                        <td>${details}</td>
                        <td style="text-align:right;">
                            <button class="btn btn-danger-soft" onclick="deleteLog('${log.id}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function deleteLog(id) {
            const res = await Swal.fire({ title: 'Delete entry?', text: "Permanent removal.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' });
            if (res.isConfirmed) {
                try {
                    await supabase.from('news_website_visitors').delete().eq('id', id);
                    document.getElementById(`row-${id}`).remove();
                    // Update the local state array too
                    allLogs = allLogs.filter(l => l.id !== parseInt(id));
                    applyFilters();
                } catch (err) { Swal.fire('Error', 'Failed to delete', 'error'); }
            }
        }

        function renderChart(logs) {
            const canvas = document.getElementById('trafficChart');
            const dateGroups = {};
            logs.forEach(log => {
                const date = new Date(log.created_at).toLocaleDateString();
                dateGroups[date] = (dateGroups[date] || 0) + 1;
            });
            const sortedDates = Object.keys(dateGroups).sort((a,b) => new Date(a) - new Date(b));
            if(myChart) myChart.destroy();
            myChart = new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [{
                        label: 'Interactions', data: sortedDates.map(d => dateGroups[d]),
                        borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.05)',
                        fill: true, tension: 0.4, pointRadius: 3
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { font: { size: 9 } } },
                        y: { grid: { color: state.theme === 'dark' ? '#334155' : '#e2e8f0' }, beginAtZero: true }
                    }
                }
            });
        }

        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', state.theme);
            initTheme();
            applyFilters(); // Re-render table and update colors
        }

        function initTheme() {
            const btn = document.getElementById('theme-btn');
            document.body.classList.toggle('dark-mode', state.theme === 'dark');
            btn.innerHTML = state.theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            if(window.Chart) Chart.defaults.color = state.theme === 'dark' ? '#94a3b8' : '#64748b';
        }

        function animateValue(id, end) {
            const obj = document.getElementById(id);
            if(!obj) return;
            let start = 0;
            const duration = 800;
            const startTime = performance.now();
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                obj.textContent = Math.floor(progress * end);
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        window.loadData = loadData;
        window.deleteLog = deleteLog;
        window.toggleTheme = toggleTheme;
        window.handleLogout = handleLogout;
        window.applyFilters = applyFilters;
    </script>
</body>
</html>
