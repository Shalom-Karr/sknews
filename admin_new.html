<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Content Admin - SK News</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Style for consistency -->
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen pt-12">

    <header class="fixed top-0 left-0 right-0 z-40 bg-gray-900/90 border-b border-gray-800 h-12 flex items-center">
        <div class="container mx-auto px-4">
            <a href="index.html" class="text-xl font-bold text-teal-400 hover:text-teal-300 transition-colors">SK News Admin</a>
        </div>
    </header>

    <main class="container mx-auto max-w-5xl px-4 py-8 mt-4">

        <!-- Login Section - Shown by default -->
        <section id="login-section" class="bg-gray-800 border border-gray-700 rounded-lg p-6 shadow-xl max-w-md mx-auto">
            <h1 class="text-3xl font-bold text-teal-400 mb-6 text-center">Admin Login</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email:</label>
                    <input type="email" id="email" name="email" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password:</label>
                    <input type="password" id="password" name="password" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                </div>
                <button type="submit" class="w-full px-4 py-2 bg-teal-600 text-white font-semibold rounded-md hover:bg-teal-700 transition-colors">Log In</button>
            </form>
        </section>

        <!-- Admin Section - Hidden by default, shown after login -->
        <section id="admin-section" class="space-y-12" style="display: none;">
            <div class="flex justify-between items-center border-b border-gray-700 pb-4">
                <h1 class="text-4xl font-bold bg-gradient-to-r from-teal-400 to-cyan-500 bg-clip-text text-transparent">
                    Website Content Management
                </h1>
                <div class="flex items-center space-x-4">
                    <p class="text-gray-400 text-sm">Welcome, <span id="user-email" class="font-semibold text-teal-400"></span>!</p>
                    <button id="logout-button" class="px-3 py-1 bg-red-600 text-white font-semibold rounded-md hover:bg-red-700 transition-colors text-sm">Log Out</button>
                </div>
            </div>

            <!-- Terms Page Content Form -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 shadow-xl">
                <h2 class="text-2xl font-semibold text-white mb-4 border-b border-gray-700 pb-2">Edit "Terms" Page</h2>
                <form id="terms-form" class="space-y-4" data-page="terms">
                    <div>
                        <label for="terms-content" class="block text-sm font-medium text-gray-300 mb-1">Content:</label>
                        <textarea id="terms-content" name="content" rows="10" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white" data-element-id="terms-content"></textarea>
                    </div>
                    <button type="submit" class="px-4 py-2 bg-teal-600 text-white font-semibold rounded-md hover:bg-teal-700 transition-colors">Save Changes</button>
                </form>
            </div>

            <!-- Join Page Content Form -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 shadow-xl">
                <h2 class="text-2xl font-semibold text-white mb-4 border-b border-gray-700 pb-2">Edit "Join" Page</h2>
                <form id="join-form" class="space-y-4" data-page="join">
                    <div>
                        <label for="join-title" class="block text-sm font-medium text-gray-300 mb-1">Title:</label>
                        <input type="text" id="join-title" name="title" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white" data-element-id="join-title">
                    </div>
                    <div>
                        <label for="join-description" class="block text-sm font-medium text-gray-300 mb-1">Description:</label>
                        <textarea id="join-description" name="description" rows="5" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white" data-element-id="join-description"></textarea>
                    </div>
                    <button type="submit" class="px-4 py-2 bg-teal-600 text-white font-semibold rounded-md hover:bg-teal-700 transition-colors">Save Changes</button>
                </form>
            </div>

            <!-- Chat Management Section -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 shadow-xl">
                <h2 class="text-2xl font-semibold text-white mb-4 border-b border-gray-700 pb-2">Manage Chats</h2>
                <form id="chat-form" class="space-y-4">
                    <input type="hidden" id="chat-id" name="id">
                    <div>
                        <label for="chat-name" class="block text-sm font-medium text-gray-300 mb-1">Chat Name:</label>
                        <input type="text" id="chat-name" name="name" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label for="chat-description" class="block text-sm font-medium text-gray-300 mb-1">Description:</label>
                        <input type="text" id="chat-description" name="description" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label for="chat-image-url" class="block text-sm font-medium text-gray-300 mb-1">Image URL:</label>
                        <input type="text" id="chat-image-url" name="image_url" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label for="chat-logo-url" class="block text-sm font-medium text-gray-300 mb-1">Logo URL:</label>
                        <input type="text" id="chat-logo-url" name="logo_url" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label for="chat-phone-number" class="block text-sm font-medium text-gray-300 mb-1">Phone Number:</label>
                        <input type="text" id="chat-phone-number" name="phone_number" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label for="chat-groupme-link" class="block text-sm font-medium text-gray-300 mb-1">GroupMe Link:</label>
                        <input type="text" id="chat-groupme-link" name="groupme_link" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                    </div>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors">Save Chat</button>
                </form>
                <div id="chat-list" class="mt-8">
                    <!-- Chat list will be populated here -->
                </div>
            </div>

            <!-- Sites Management Section -->
            <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 shadow-xl">
                <h2 class="text-2xl font-semibold text-white mb-4 border-b border-gray-700 pb-2">Manage Sites</h2>
                <form id="site-form" class="space-y-4">
                    <input type="hidden" id="site-id" name="id">
                    <div>
                        <label for="site-title" class="block text-sm font-medium text-gray-300 mb-1">Site Title:</label>
                        <input type="text" id="site-title" name="title" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label for="site-url" class="block text-sm font-medium text-gray-300 mb-1">URL:</label>
                        <input type="url" id="site-url" name="url" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white">
                    </div>
                    <div>
                        <label for="site-description" class="block text-sm font-medium text-gray-300 mb-1">Description:</label>
                        <textarea id="site-description" name="description" rows="3" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md focus:ring-teal-500 focus:border-teal-500 text-white"></textarea>
                    </div>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors">Save Site</button>
                </form>
                <div id="site-list" class="mt-8">
                    <!-- Site list will be populated here -->
                </div>
            </div>

        </section>
    </main>

    <script type="module" src="supabase-client.js"></script>
    <script type="module" src="admin_new.js"></script>
</body>
</html>
