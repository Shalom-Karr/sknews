<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Sites - SK News</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
    <link rel="canonical" href="https://SKNews.pages.dev/sites.html" />
</head>
<body class="bg-gray-900 text-gray-200">

    <header class="fixed top-0 left-0 right-0 z-40 bg-gray-900/80 backdrop-blur-sm border-b border-gray-800 transition-all duration-300">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="text-2xl font-bold text-teal-400 hover:text-teal-300 transition-colors">SK News</a>
                <nav class="hidden md:flex space-x-8" id="main-nav">
                    <a href="index.html" class="text-gray-300 hover:text-teal-400 transition-colors">Home</a>
                    <a href="feed.html" class="text-gray-300 hover:text-teal-400 transition-colors">Live</a>
                    <a href="news.html" class="text-gray-300 hover:text-teal-400 transition-colors">News</a>
                    <a href="chats.html" class="text-gray-300 hover:text-teal-400 transition-colors">Chats</a>
                    <a href="sites.html" class="text-gray-300 hover:text-teal-400 transition-colors">Sites</a>
                    <a href="join.html" class="text-gray-300 hover:text-teal-400 transition-colors">Join</a>
                    <a href="about.html" class="text-gray-300 hover:text-teal-400 transition-colors">About</a>
                    <a href="advertise.html" class="text-gray-300 hover:text-teal-400 transition-colors">Advertise</a>
                    <a href="contact.html" class="text-gray-300 hover:text-teal-400 transition-colors">Contact</a>
                </nav>
                <button class="md:hidden hamburger flex flex-col justify-center items-center h-8 w-8 space-y-1.5" id="hamburger-menu" aria-label="Open Menu">
                    <span class="block h-0.5 w-6 bg-gray-200 rounded-full"></span>
                    <span class="block h-0.5 w-6 bg-gray-200 rounded-full"></span>
                    <span class="block h-0.5 w-6 bg-gray-200 rounded-full"></span>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-gray-900/95 backdrop-blur-sm">
            <nav class="flex flex-col items-center space-y-4 py-6">
                <a href="index.html" class="text-gray-300 hover:text-teal-400 transition-colors">Home</a>
                <a href="feed.html" class="text-gray-300 hover:text-teal-400 transition-colors">Live</a>
                <a href="news.html" class="text-gray-300 hover:text-teal-400 transition-colors">News</a>
                <a href="chats.html" class="text-gray-300 hover:text-teal-400 transition-colors">Chats</a>
                <a href="sites.html" class="text-gray-300 hover:text-teal-400 transition-colors">Sites</a>
                <a href="join.html" class="text-gray-300 hover:text-teal-400 transition-colors">Join</a>
                <a href="about.html" class="text-gray-300 hover:text-teal-400 transition-colors">About</a>
                <a href="advertise.html" class="text-gray-300 hover:text-teal-400 transition-colors">Advertise</a>
                <a href="contact.html" class="text-gray-300 hover:text-teal-400 transition-colors">Contact</a>
            </nav>
        </div>
    </header>

    <main class="pt-20">
        <section class="py-20 text-center bg-gray-800/50">
            <div class="container mx-auto px-4">
                <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-teal-400 to-cyan-500 bg-clip-text text-transparent">Our Other Projects</h1>
                <p class="mt-4 text-lg text-gray-300 max-w-3xl mx-auto">Explore other websites and applications developed by our team.</p>
            </div>
        </section>

        <section class="py-20">
            <div class="container mx-auto px-4">
                <div id="sites-grid" class="grid md:grid-cols-2 gap-8">
                    <!-- Site links will be loaded here dynamically -->
                </div>
            </div>
        </section>
    </main>

    <footer class="border-t border-gray-800 bg-gray-900">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8"><div class="flex flex-col sm:flex-row items-center justify-between py-6 text-sm text-gray-500"><p>© 2025 SK News. All Rights Reserved.</p><a href="terms.html" class="mt-2 sm:mt-0 hover:text-teal-400 transition-colors">Terms & Conditions</a></div></div>
    </footer>

    <script type="module">
        import { supabase } from './supabase-client.js';

        const hamburgerBtn = document.getElementById('hamburger-menu');
        const mobileMenu = document.getElementById('mobile-menu');
        hamburgerBtn.addEventListener('click', () => {
            hamburgerBtn.classList.toggle('is-active');
            mobileMenu.classList.toggle('hidden');
        });

        async function loadSites() {
            const { data: sites, error } = await supabase
                .from('sites')
                .select('*')
                .order('id');

            if (error) {
                console.error('Error fetching sites:', error);
                const sitesGrid = document.getElementById('sites-grid');
                sitesGrid.innerHTML = `<p class="text-center text-red-400 col-span-2">Could not load sites. Please try again later.</p>`;
                return;
            }

            const sitesGrid = document.getElementById('sites-grid');
            if (sites.length === 0) {
                sitesGrid.innerHTML = `<p class="text-center text-gray-400 col-span-2">No sites to display.</p>`;
                return;
            }

            sitesGrid.innerHTML = sites.map(site => `
                <a href="${site.url}" target="_blank" class="block p-8 bg-gray-800/50 border border-gray-700 rounded-lg hover:bg-gray-800 transition-colors">
                    <h3 class="text-2xl font-semibold text-white">${site.title}</h3>
                    <p class="mt-2 text-gray-400">${site.description}</p>
                </a>
            `).join('');
        }

        loadSites();
    </script>
</body>
</html>
